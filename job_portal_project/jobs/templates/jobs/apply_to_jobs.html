{% extends "base.html" %}

{% block title %}HireSmart - Apply Jobs{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded-2xl shadow-md border border-gray-200">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">
        Apply to <span class="text-blue-600">{{ job.job_title }}</span> at <span class="text-gray-600">{{ job.company_name }}</span>
    </h2>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <div>
            <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message (optional)</label>
            <textarea 
                name="message" 
                id="message" 
                rows="5" 
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-400 focus:outline-none resize-none" 
                placeholder="Write a message to the employer..."></textarea>
        </div>

        <div class="flex justify-end space-x-1.5">
            <button 
                type="submit" 
                class="bg-gray-900 hover:bg-gray-700 hover:cursor-pointer text-white font-semibold px-6 py-2 rounded-xl transition duration-200">
                Submit Application
            </button>
            <a href="{% url "job_details" job.id %}" 
                type="submit" 
                class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-2 rounded-xl transition duration-200">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
